// Top-level build file where you can add configuration options common to all sub-projects/modules.
ext {
    // Android (Compile/Target) SDK Version
    sdk_version = 36
}

buildscript {
    ext.java_version = JavaVersion.VERSION_17
    ext.build_tools_version = '36.1.0'

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        // Since newer version 0.10.9 is broken
        // see: https://github.com/google/play-services-plugins/issues/296
        //noinspection GradleDependency
        classpath 'com.google.android.gms:oss-licenses-plugin:0.10.7'
        classpath 'de.undercouch:gradle-download-task:5.6.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    gradle.projectsEvaluated {
        tasks.withType(JavaCompile).tap {
            configureEach {
                options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
            }
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
